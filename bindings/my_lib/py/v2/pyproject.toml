[project]
name = "my-lib-v2"
version = "0.1.0"
description = "Generic WebAssembly WASI Preview 2 (Component Model) bindings demonstration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "wasmtime>=12.0.0",
    "componentize-py>=0.10.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
